{% macro icon(name, cls="size-6") %}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == "send" %}<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
  {% elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
  {% elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
  {% elif name == "lock" %}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
  {% elif name == "mic" %}<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
  {% elif name == "trash" %}<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
  {% elif name == "chevron-down" %}<path d="m6 9 6 6 6-6"/>
  {% elif name == "chevron-up" %}<path d="m18 15-6-6-6 6"/>
  {% elif name == "check" %}<polyline points="20 6 9 17 4 12"/>
  {% elif name == "log-out" %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
  {% elif name == "close" %}<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  {% endif %}
</svg>
{% endmacro %}

{% macro avatar(title="A", cls="size-10") %}
<div class="{{ cls }} rounded-full bg-accent text-on-accent flex items-center justify-center font-medium select-none text-[15px] shrink-0">
  {{ title[:1] | upper if title else '?' }}
</div>
{% endmacro %}
