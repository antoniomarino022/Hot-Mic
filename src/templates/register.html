<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hot-Mic 🎙️ | Accedi</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Telegram UI CSS Library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@telegram-apps/telegram-ui@latest/dist/styles.css">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/static/css/output.css">

    <style>
        :root {
            --tg-theme-bg-color: #0e1621;
            --tg-theme-secondary-bg-color: #17212b;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #7f91a4;
            --tg-theme-link-color: #5288c1;
            --tg-theme-button-color: #2b72c9;
            --tg-theme-button-text-color: #ffffff;
        }

        body {
            background-color: var(--tg-theme-bg-color, #0e1621);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }

        .tg-card {
            background-color: var(--tg-theme-secondary-bg-color, #17212b);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
        }

        .tg-btn-primary {
            background-color: var(--tg-theme-button-color, #2b72c9);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 20px;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
        }

        .tg-btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .tg-btn-secondary {
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--tg-theme-hint-color, #7f91a4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-weight: 500;
            border-radius: 12px;
            padding: 10px 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .tg-btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .alert-box {
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="tg-card text-center">
        <!-- Logo and Title -->
        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 mb-3 shadow-lg">
                <span class="text-3xl">🎙️</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Hot-Mic</h1>
            <p class="text-sm mt-1" style="color: var(--tg-theme-hint-color);">Confessioni anonime</p>
        </div>

        {% if user %}
        <!-- User Authenticated State -->
        <div class="p-4 rounded-xl bg-black/20 border border-green-500/30 space-y-4">
            <div class="text-green-400 font-semibold text-sm">
                ✅ Sei connesso
            </div>
            <a href="/confession" class="tg-btn-primary block">
                Vai alle Confessioni
            </a>
            <button onclick="handleLogout()" class="tg-btn-secondary text-red-400 hover:text-red-300">
                Disconnetti
            </button>
        </div>

        {% else %}
        <!-- Login Form -->
        <div id="alertBox" class="alert-box mb-4 text-left"></div>

        <div class="space-y-4 text-left">
            <!-- Terms Checkbox -->
            <div class="flex items-start gap-3 p-3 rounded-xl bg-black/20 border border-white/5">
                <input 
                    type="checkbox" 
                    id="termsAccepted" 
                    class="mt-1 w-4 h-4 rounded text-blue-600 focus:ring-blue-500 bg-gray-900 border-gray-700" 
                    checked
                />
                <label for="termsAccepted" class="text-xs leading-relaxed" style="color: var(--tg-theme-hint-color);">
                    Accetto i <a href="#" class="underline text-blue-400">Termini di Servizio</a> e la Privacy Policy.
                </label>
            </div>

            <!-- Mini App Section (when opened inside Telegram) -->
            <div id="miniAppSection" class="hidden">
                <button onclick="handleTmaLogin()" class="tg-btn-primary">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
                    <span>Accedi con Telegram</span>
                </button>
            </div>

            <!-- Web Widget Section (for standard desktop/mobile browsers) -->
            <div id="webWidgetSection" class="text-center pt-2">
                <div class="flex justify-center min-h-[44px]">
                    <script 
                        async 
                        src="https://telegram.org/js/telegram-widget.js?22" 
                        data-telegram-login="{{ bot_username }}" 
                        data-size="large" 
                        data-radius="12" 
                        data-onauth="onTelegramAuth(user)" 
                        data-request-access="write">
                    </script>
                </div>
            </div>
        </div>
        {% endif %}
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        // Detect Telegram WebApp environment
        document.addEventListener('DOMContentLoaded', () => {
            if (tg && tg.initData && tg.initData.length > 0) {
                tg.ready();
                tg.expand();
                const miniAppSec = document.getElementById('miniAppSection');
                const webSec = document.getElementById('webWidgetSection');
                if (miniAppSec) miniAppSec.classList.remove('hidden');
                if (webSec) webSec.classList.add('hidden');
            }
        });

        function showAlert(message, type = 'error') {
            const box = document.getElementById('alertBox');
            if (!box) return;
            box.style.display = 'block';
            if (type === 'error') {
                box.className = 'alert-box mb-4 bg-red-500/20 text-red-300 border border-red-500/40';
            } else {
                box.className = 'alert-box mb-4 bg-green-500/20 text-green-300 border border-green-500/40';
            }
            box.innerText = message;
        }

        // Callback from Telegram Login Widget
        async function onTelegramAuth(user) {
            const termsAccepted = document.getElementById('termsAccepted')?.checked;
            if (!termsAccepted) {
                showAlert('Devi accettare i termini per continuare.', 'error');
                return;
            }

            try {
                const response = await fetch('/auth/widget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...user,
                        accepted: true
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Errore durante l\'autenticazione.');
                }

                window.location.href = '/confession';
            } catch (err) {
                showAlert(err.message, 'error');
            }
        }

        // Login inside Telegram Mini App
        async function handleTmaLogin() {
            if (!tg || !tg.initData) {
                showAlert('Nessun dato Telegram WebApp rilevato.', 'error');
                return;
            }

            const termsAccepted = document.getElementById('termsAccepted')?.checked;
            if (!termsAccepted) {
                showAlert('Devi accettare i termini per continuare.', 'error');
                return;
            }

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        data: {
                            init_data: tg.initData
                        },
                        checkbox: {
                            accepted: true
                        }
                    })
                });

                const resData = await response.json();
                if (!response.ok) {
                    throw new Error(resData.detail || 'Errore durante la registrazione.');
                }

                window.location.href = '/confession';
            } catch (err) {
                showAlert(err.message, 'error');
            }
        }

        // Logout
        async function handleLogout() {
            try {
                await fetch('/auth/logout', { method: 'POST' });
                window.location.reload();
            } catch (err) {
                showAlert('Errore durante il logout.', 'error');
            }
        }
    </script>
</body>
</html>
